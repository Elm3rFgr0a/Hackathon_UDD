service: hackathonUDD

frameworkVersion: '3'

# Carga backend/.env para resolver ${env:...} (JWT_SECRET).
useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  # Perfil local de AWS (ver docs/PLAN_BACKEND.md). La cuenta es compartida con otros proyectos.
  profile: hackaton
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 10
  httpApi:
    cors: true
  environment:
    TABLE_NAME: ${self:custom.tableName}
    JWT_SECRET: ${env:JWT_SECRET}
    APP_TZ: America/Santiago
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
          Resource:
            - !GetAtt CercaTable.Arn
            - !Join ['', [!GetAtt CercaTable.Arn, '/index/*']]

custom:
  tableName: Cerca-${sls:stage}
  prune:
    automatic: true
    number: 1
  serverless-offline:
    httpPort: 3000

package:
  patterns:
    - '!**/*.test.js'
    - '!.env*'
    - '!Dockerfile'

functions:
  api:
    handler: src/handler.handler
    events:
      - httpApi: '*'

plugins:
  - serverless-offline
  - serverless-prune-plugin

resources:
  Resources:
    CercaTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

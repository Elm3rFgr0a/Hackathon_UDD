service: hackathonUDD

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  environment:
    ENVIRONMENT: ${self:provider.stage}

custom:
  prune:
    automatic: true
    number: 1

functions:
  users:
    handler: src/handlers/users/usersHandler.handler
    events:
      - http:
          path: users
          method: post
          cors: true
      - http:
          path: users
          method: get
          cors: true
      - http:
          path: users/{idUsuario}
          method: get
          cors: true

plugins:
  - serverless-offline
  - serverless-dotenv-plugin
  - serverless-prune-plugin
